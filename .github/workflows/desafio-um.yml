name: Desafio Um 

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: "Nome da imagem Docker"
        required: true
        type: string
      image_tag:
        description: "Tag da imagem"
        required: true
        type: string

jobs:
  check-image-docker:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar e verificar imagem Docker 
      run: | 
          docker pull ${{github.event.inputs.image_name}}:${{github.event.inputs.image_tag}}
          docker images

    - name: Login no Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USER }}
        password: ${{ secrets.DOCKER_HUB_PAT }}

    - name: Analisar vulnerabilidade com Docker Scout
      uses: docker/scout-action@v1
      with:
        command: cves
        image: ${{github.event.inputs.image_name}}:${{github.event.inputs.image_tag}}